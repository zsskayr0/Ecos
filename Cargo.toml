[workspace]
resolver = "2"
members = [
    "crates/ecos-core",
    "app/server",
    "app/vault",
]

[workspace.package]
version = "0.11.0-alpha"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
ecos-core = { path = "crates/ecos-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "1", features = ["serde"] }
regex = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
axum-extra = { version = "0.9", features = ["cookie", "cookie-private", "typed-header"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "set-header", "trace", "limit", "fs"] }

rusqlite = { version = "0.31", features = ["bundled", "backup"] }
rusqlite_migration = "1"

argon2 = "0.5"
subtle = "2"
rand = "0.8"
jsonwebtoken = "9"
sha2 = "0.10"
base64 = "0.22"
time = "0.3"
bip39 = { version = "2", features = ["rand"] }

# rustls em vez de native-tls: evita depender de OpenSSL do sistema pra
# compilar `ecos-app` (só o `ecos-vault-db` precisa de toolchain OpenSSL,
# e só pra SQLCipher — ver app/vault/Cargo.toml).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

notify = "6"
walkdir = "2"
mdns-sd = "0.11"
