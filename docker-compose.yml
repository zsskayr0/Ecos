# Ecos â€” self-hosting leve, modelo Jellyfin (seÃ§Ã£o 2 da arquitetura).
#
#   docker compose up -d                              # sÃ³ Notas/Tarefas
#   docker compose --profile vault --profile default up -d   # + Cofre
#
# `.env` (copie de `.env.example`) configura tudo que muda por instÃ¢ncia.

# Nome fixo: preserva os volumes existentes (ecos-tasksandnotes_*) mesmo com a pasta se chamando "Ecos - App".
name: ecos-tasksandnotes

services:
  ecos-app:
    build:
      context: .
      dockerfile: app/server/Dockerfile
    image: ${ECOS_REGISTRY:-docker.io}/ecos/app:${ECOS_VERSION:-local}
    restart: unless-stopped
    environment:
      - ECOS_VAULT_ENABLED=${ECOS_VAULT_ENABLED:-false}
      - ECOS_VAULT_URL=http://ecos-vault-db:8090
      - ECOS_ENV=production
      - ECOS_SESSION_SECRET=${ECOS_SESSION_SECRET:-}
      - ECOS_PORT=7023
      # Google Calendar (opcional): sem as duas primeiras a integraÃ§Ã£o fica desligada.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - ECOS_CALENDARIO_INTERVAL_SECS=${ECOS_CALENDARIO_INTERVAL_SECS:-300}
      - ECOS_CALENDARIO_ENVIO_IMEDIATO=${ECOS_CALENDARIO_ENVIO_IMEDIATO:-true}
    volumes:
      - ${ECOS_NOTES_PATH:-../Ecos - Notes}:/data/notes
      - ecos-index:/data/index
      - ecos-backups:/data/backups
    profiles: ["default"]
    # Precisa estar nas duas redes: `default` (rede do host/VPN) e
    # `internal` (pra alcanÃ§ar o ecos-vault-db pelo nome do serviÃ§o) â€” o
    # vault-db em si fica sÃ³ em `internal`, nunca em `default`.
    networks: [default, internal]
    # Sem `depends_on: [ecos-vault-db]` de propÃ³sito: o Cofre Ã© opcional
    # (seÃ§Ã£o 0.3, princÃ­pio 3) â€” `ecos-app` sobe sozinho com o profile
    # `default` e detecta o vault indisponÃ­vel em runtime (`/health/ready`,
    # proxy retorna erro tratado), nunca trava a inicializaÃ§Ã£o por causa
    # dele.

  ecos-vault-db:
    build:
      context: .
      dockerfile: app/vault/Dockerfile
    image: ${ECOS_REGISTRY:-docker.io}/ecos/vault-db:${ECOS_VERSION:-local}
    restart: unless-stopped
    networks: [internal]
    volumes:
      - ecos-vault:/data/vault
      - ecos-vault-backups:/data/backups
    profiles: ["vault"]

networks:
  internal:
    internal: true # sem rota pra fora â€” isola o vault-db (seÃ§Ã£o 2)

volumes:
  ecos-index:
  ecos-backups:
  ecos-vault:
  ecos-vault-backups:
