name: Imagens Docker versionadas

# Ao empurrar uma tag `vX.Y.Z[-pre]`, publica as imagens com a versão no nome (nunca `local`):
#   ghcr.io/<dono>/ecos/app:X.Y.Z   ghcr.io/<dono>/ecos/vault-db:X.Y.Z
# e confere antes que a tag bate com a versão do código. Quem hospeda usa: ECOS_REGISTRY=ghcr.io/<dono> ECOS_VERSION=X.Y.Z
on:
  push:
    tags: ["v*"]

jobs:
  testes:
    name: Testes antes de publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verificar-versoes.mjs "${{ github.ref_name }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  publicar:
    name: Publicar ${{ matrix.imagem }}
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - imagem: app
            dockerfile: app/server/Dockerfile
          - imagem: vault-db
            dockerfile: app/vault/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ecos/${{ matrix.imagem }}
          # Só a versão exata: sem `latest` automático, para ninguém subir de versão sem querer.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.imagem }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagem }}
