[package]
name = "ecos-client"
version = "0.1.0"
description = "Ecos — cliente desktop/mobile (Tauri + React), ver ecos-arquitetura-tecnica.md seção 10"
edition = "2021"
publish = false

# Deliberadamente FORA do [workspace] raiz do repositório (Cargo.toml na
# raiz do projeto): compilar o shell Tauri exige toolchain de GUI (WebView2
# no Windows, webkit2gtk no Linux) que `apps/server`/`apps/vault` não
# precisam — mantém `cargo build --workspace` na raiz rápido e sem essa
# dependência. Ver ecos-stack-decision (memória do projeto) sobre "Rust em
# tudo": isso não contradiz a decisão, só isola a superfície de build.
[lib]
name = "ecos_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
