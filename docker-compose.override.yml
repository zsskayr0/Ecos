# Override de desenvolvimento local — aplicado automaticamente pelo Docker
# Compose junto do docker-compose.yml (não versionar nada sensível aqui).
# Só existe pra publicar a porta do ecos-app no host: em produção real
# (seção 2, cloudflared) o acesso é via túnel/rede interna, nunca porta
# publicada direto — isto é só pra testar localmente sem o túnel.
#
# 4090 (não 7023): a porta 7023 já é usada nesta máquina pelo container
# `nexus-server` (outro projeto) — o ecos-app continua ouvindo em 7023
# *dentro* do container, só o mapeamento externo muda. Escolhida 4090
# porque agora ele serve UI+API juntos (ver ECOS_STATIC_DIR/main.rs),
# uma porta só, como Immich/Jellyfin.
#
# Sem "127.0.0.1:" na frente de propósito: isso restringiria a porta ao
# próprio PC (loopback) — o celular/outro dispositivo na LAN nunca
# conseguiria conectar. Publicando em todas as interfaces (0.0.0.0
# implícito), qualquer um na mesma rede alcança pelo IP do PC.
services:
  ecos-app:
    ports:
      - "4090:7023"
