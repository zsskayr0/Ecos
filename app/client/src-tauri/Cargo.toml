[package]
name = "ecos-client"
version = "0.5.4-alpha"
description = "Ecos — desktop/mobile client (Tauri + React), see ecos-arquitetura-tecnica.md section 10"
edition = "2021"
publish = false

# Deliberately OUTSIDE the repo root's [workspace] (the project root's
# Cargo.toml): compiling the Tauri shell requires a GUI toolchain
# (WebView2 on Windows, webkit2gtk on Linux) that `apps/server`/`apps/vault`
# don't need — keeps `cargo build --workspace` at the root fast and free
# of that dependency. See ecos-stack-decision (project memory) on "Rust
# everywhere": this doesn't contradict that decision, it just isolates
# the build surface. An empty `[workspace]` table here is what actually
# enforces that (found the hard way running `tauri android init`): being
# nested under the root `Cargo.toml` without it, Cargo treats this crate
# as an implicit, unlisted workspace member and refuses to build it
# standalone — the comment alone wasn't load-bearing.
[workspace]

[lib]
name = "ecos_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager; the refresh credential never enters WebView
# storage or the application's regular data directory.
keyring = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
